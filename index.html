<!DOCTYPE html>
<html>
<head>
<title>JavaScript Calculator App - Web Calculator</title>
<style>
body{margin:0;background:#eef2f7;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;font-family:Arial, sans-serif}
h1{margin:0 0 5px 0;font-size:28px;color:#222}
p{margin:0 0 20px 0;color:#555;font-size:16px}
.calculator{width:300px;background:white;padding:20px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.2);border:1px solid #ddd}
.display{width:100%;height:60px;background:#1e1e1e;color:white;border:none;border-radius:10px;text-align:right;font-size:32px;padding:10px 15px;box-sizing:border-box;margin-bottom:20px}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.btn{height:65px;border:none;border-radius:15px;font-size:22px;font-weight:bold;cursor:pointer;transition:0.2s}
.btn:active{transform:scale(0.95)}
.num{background:#f1f1f1;color:#000}.num:hover{background:#e0e0e0}
.op{background:#ff9500;color:white}.op:hover{background:#e68a00}
.clear{background:#ff3b30;color:white}
.equal{background:#34c759;color:white;grid-column:span 1}
.footer{margin-top:20px;font-size:13px;color:#888}
</style>
</head>
<body>

<h1>JavaScript Calculator App</h1>
<p>Web Calculator - Fast & Simple</p>

<div class="calculator">
<input type="text" id="display" class="display" value="0" disabled>
<div class="buttons">
<button class="btn num" onclick="press('7')">7</button>
<button class="btn num" onclick="press('8')">8</button>
<button class="btn num" onclick="press('9')">9</button>
<button class="btn op" onclick="press('/')">÷</button>

<button class="btn num" onclick="press('4')">4</button>
<button class="btn num" onclick="press('5')">5</button>
<button class="btn num" onclick="press('6')">6</button>
<button class="btn op" onclick="press('*')">×</button>

<button class="btn num" onclick="press('1')">1</button>
<button class="btn num" onclick="press('2')">2</button>
<button class="btn num" onclick="press('3')">3</button>
<button class="btn op" onclick="press('-')">-</button>

<button class="btn clear" onclick="clearDisplay()">C</button>
<button class="btn num" onclick="press('0')">0</button>
<button class="btn equal" onclick="calculate()">=</button>
<button class="btn op" onclick="press('+')">+</button>
</div>
</div>

<div class="footer">Made by Imran Nida | Web Calculator</div>

<script>
let current=''; let display=document.getElementById('display');
function press(v){if(current==='0')current=''; current+=v; display.value=current;}
function clearDisplay(){current=''; display.value='0';}
function calculate(){try{current=eval(current).toString(); display.value=current;}catch{display.value='Error'; current='';}}
</script>
</body>
</html>
